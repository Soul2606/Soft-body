<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="style.css">
	<script type="module" src="dist/main.js" defer></script>
</head>
<body>
	<main>
		<div class="side-menu">
			<button id="select">Select</button>
			<button id="add">Add</button>
			<button id="delete">Delete</button>
			<button id="connect">Connect</button>
			<button id="drag">Drag</button>
			<button id="move">Move</button>
			<button id="save">Save</button>
			<button id="load">Load</button>
			<div class="d-pad">
				<button id="left" style="grid-area: 2/1/3/2;">←</button>
				<button id="up" style="grid-area: 1/2/2/3;">↑</button>
				<button id="right" style="grid-area: 2/3/3/4;">→</button>
				<button id="down" style="grid-area: 3/2/4/3;">↓</button>
			</div>
		</div>
		<canvas id="canvas" width="1200" height="700" style="border: solid black 1px;"></canvas>
		<p id="mouse-pos"></p>
	</main>
	<ul id="info"></ul>
</body>
</html>
